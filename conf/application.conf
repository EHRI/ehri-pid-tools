# https://www.playframework.com/documentation/latest/Configuration

# Since we have transactional DDL in PostgreSQL
evolutions.autoCommit = false

# Return errors as JSON
play.http.errorHandler = services.AppErrorHandler

# DB config: obviously override this in prod
db {
  default {
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://localhost:5432/pids"
    username = "pids"
    password = "changeme"
  }
}

# Cache WS responses
play.ws.cache.enabled = true

# General service configuration.
service {
  # Indicate that HTTPS is being used. NB: Play's request.secure
  # may not work if behind a proxy server.
  https = false

  # Extra HTML/JS/CSS config to go in the header, e.g. analytics
  extraHeadContent = ""
}

# DOI config: change this in prod
doi {
  default {
    prefix = 10.12345
    resolverUrl = "https://handle.test.datacite.org"
    resolverPrefix = "https://api.test.datacite.org/dois/"
    api {
      baseUrl = "https://api.test.datacite.org/dois"
      repositoryId = "testing"
      repositorySecret = "changeme"
    }
    # Display draft/registered DOIs in addition to
    # those with state = findable
    showHidden = true
  }
}

# How long to cache site previews
preview.cache.time = 60 seconds

# Periodic check that PID targets still resolve...
targetHealthCheck {
  enabled = true
  # Which PID type(s) to check: DOI, ARK, HANDLE, PURL, URN
  pidTypes = [DOI]
  initialDelay = 1 minute
  interval = 24 hours
  requestTimeout = 10 seconds
  # Number of extra attempts for a target that fails, to ride out transient errors
  retries = 2
  retryDelay = 2 seconds
  # Max number of targets checked at once...
  parallelism = 8
  # Paces requests over time so we don't burst-fire them all at once
  throttle {
    elements = 5
    per = 1 second
  }
  # Cap concurrent connections to any single target host, so a large number
  # of DOIs pointing at the same host don't overload it during a health check.
  # Applied only to the health checker's own dedicated WSClient (see Module).
  maxConnectionsPerHost = 2
}

# DOI configuration: see test.conf for an example
include "doi.conf"

# Auth configuration is stored in clients.conf
# See test.conf for example configuration.
include "clients.conf"
